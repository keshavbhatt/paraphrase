# Tests and lint for both halves: the Python eval harness and the C++ daemon (as Omnidict).
# Tests that need a model skip when it is not downloaded, so no model is fetched here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Same majors as the development machine; Ubuntu's own packages are older and check
  # differently.
  CLANG_FORMAT_VERSION: "23.1.1"
  CLANG_TIDY_VERSION: "23.1.3"

jobs:
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: make lint-eval

      - name: Test
        run: make test-eval

  daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: KDE Qt SDK and runtime snaps
        run: |
          sudo snap install kde-qt6-core24-sdk
          sudo snap install kf6-core24
          sudo snap install cmake --classic
          # The runner is Ubuntu 24.04 (core24), so scripts/dev-build.sh builds here directly with the
          # same packages as packaging/core24/Dockerfile.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential \
            libglib2.0-0t64 libdbus-1-3 libduktape207 dbus-daemon shellcheck

      - uses: astral-sh/setup-uv@v6

      - name: Build with warnings as errors
        env:
          PARAPHRASE_CMAKE_ARGS: "-DPARAPHRASE_BUILD_TESTS=ON -DPARAPHRASE_WERROR=ON"
        run: scripts/dev-build.sh

      - name: Test
        run: scripts/dev-run.sh --ctest

      - name: clang-format
        run: |
          find daemon -name '*.cpp' -o -name '*.h' \
            | xargs uvx --from "clang-format==${CLANG_FORMAT_VERSION}" clang-format --dry-run --Werror

      - name: clang-tidy
        run: |
          find daemon -name '*.cpp' \
            | xargs uvx --from "clang-tidy==${CLANG_TIDY_VERSION}" clang-tidy -p build/dev --quiet --warnings-as-errors='*'

      - name: shellcheck
        run: shellcheck -x scripts/*.sh

  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5
