he status of the bathroom renovation. The original schedule for completion was set for the 1st, however, the work has progressed significantly to the 19th. Your team is currently arriving by 11:00 AM and leaving by 2:00 PM. Additionally, half of your scheduled days are now unoccupied; only when absolutely necessary would you be required to attend.\n\nRegarding the plumbing infrastructure, the tiles within the shower area are exhibiting cracking, and the grout lines appear discolored and in need of repair. I have already paid you $8,500 out of the total $12,000 budget allocated for this project. There is no additional payment pending until the work is completed to a satisfactory standard.\n\nI require your written confirmation to specify the exact date by which the job will be finished and the names of any personnel currently responsible for managing the tiles. If the work does not conclude within the month, I am authorized to hire an alternate contractor to replace the original party and remove them from your account. Please provide this update in writing immediately."}, {"letter": "D", "text": "Steve, the bathroom was scheduled for completion by the 1st, and it is currently the 19th. Your team arrives at 11:00 AM and departs at 2:00 PM, and on half the days, they do not arrive at all. The tiles in the shower are already cracking, and the grout is in poor condition. I have paid you \\$8,500 of the \\$12,000 fee and will not remit further payment until the work is completed properly. Please provide written confirmation detailing the completion date and identifying the individual responsible for the tile repairs. If the work is not finalized by the end of the month, I will engage another contractor and deduct the costs from the outstanding amount owed to you."}, {"letter": "E", "text": "Dear Steve, The completion date for the bathroom was scheduled for the 1st, and it is currently the 19th. Your crew has been present from 11:00 AM to 2:00 PM, and on several occasions, oncern for anyone."}, {"letter": "C", "text": "Please refrain from including the entire company on every email."}, {"letter": "D", "text": "Please refrain from including the entire company on every email correspondence."}, {"letter": "E", "text": "Please avoid copying all employees on every email, as this is not necessary and may not be well received."}]}, {"id": "rw-en-004", "skill": "rewrite.professional", "lang": "en", "input": "yo Sam, gonna need fri off, my sister's wedding is this weekend and I gotta help set up. cool?", "draft": "", "reference": "", "outputs": [{"letter": "A", "text": "Hi Sam, I will need your Friday off. My sister's wedding is happening this weekend, and I need to assist with the setup. Is that convenient for you?"}, {"letter": "B", "text": "Dear Sam, I will require a day off this coming Friday to assist with my sister's wedding preparations. Please let me know if this is acceptable."}, {"letter": "C", "text": "Hello Sam, I am arriving early to assist with my sister's upcoming wedding for the weekend; I will do everything possible to prepare for this event. Is it convenient for you to join me?"}, {"letter": "D", "text": "Sam, I will require Friday off as I need to assist with setting up my sister's wedding this weekend. Please let me know if this is acceptable."}, {"letter": "E", "text": "Subject: Time Off Request for Upcoming Weekend\n\nDear Sam,\n\nI am writing to request time off this weekend as my sister is getting married and I need to assist with the setup arrangements. Please let me know if this works for you.\n\nBest regards,\n\n[Your Name]"}]}, {"id": "rw-hi-006", "skill": "rewrite.professional", "lang": "hi", "input": "तुमने फिर से रिपोर्ट गलत भेज दी। हर बार मुझे ही ठीक करनी पड़ती है। ध्यान से काम करो।", "draft": "", "reference": "", "outputs": [{"letter": "A", "text": "तुमने फिर से रिपोर्ट गलत भेज दी। हर बार मुझे ही ठीक करनी पड़ती है। ध्यान से काम करो।"}, {"letter": "B", "text": "आपने पुनः त्रुटिपूर्ण रिपोर्ट प्रेषित की है। प्रत्य const KEY = "spotcheck-" + DATA.tag;
let ratings = {};
try { ratings = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { ratings = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(ratings)); } catch (e) {} progress(); }
function progress() {
  let done = 0, total = 0;
  for (const c of DATA.cards) for (const o of c.outputs) { total++;
    if (ratings[c.id] && ratings[c.id][o.letter] && ratings[c.id][o.letter].rating) done++; }
  document.getElementById("progress").textContent = done + " / " + total + " rated";
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; return e; }
const root = document.getElementById("cards");
DATA.cards.forEach((c, i) => {
  const card = el("section", "card");
  card.append(el("div", "meta", (i + 1) + ". " + c.skill + " · " + c.lang + " · " + c.id));
  const inp = el("div", "input"); inp.append(el("pre", "", c.input)); card.append(inp);
  if (c.draft) card.append(el("div", "meta", "User's started draft: " + c.draft));
  if (c.reference) { const r = el("div", "ref"); r.append(el("pre", "", "Reference: " + c.reference));
    card.append(r); }
  for (const o of c.outputs) {
    const row = el("div", "out"); row.append(el("div", "letter", o.letter));
    const body = el("div"); body.append(el("pre", "", o.text));
    const btns = el("div", "btns");
    const cur = (ratings[c.id] || {})[o.letter] || {};
    for (const r of ["good", "ok", "bad"]) {
      const b = el("button", cur.rating === r ? "on" : "", r); b.dataset.r = r;
      b.onclick = () => { ratings[c.id] = ratings[c.id] || {};
        ratings[c.id][o.letter] = Object.assign(ratings[c.id][o.letter] || {}, { rating: r });
        btns.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); save(); };
      btns.append(b);
    }
    const note = el("input", "note"); note.placeholder = "note (optional)"; note.value = cur.note || "";
    note.oninput = () => { ratings[c.id] = ratings[c.id] || {};
      ratings[c.id][o.letter] = Object.assign(ratings[c.id][o.letter] || {}, { note: note.value }); save(); };
    btns.append(note); body.append(btns); row.append(body); card.append(row);
  }
  root.append(card);
});
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify({ tag: DATA.tag, ratings }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "ratings-" + DATA.tag + ".json"; a.click();
};
progress();
</script></body></html>
